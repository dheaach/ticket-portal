# Deskteam360 (my-app) — Node 20, Next.js, PM2
# Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
# Build runs on GitHub Actions (7GB RAM), server hanya extract + pm2 restart

name: Deskteam360 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HUSKY: 0

permissions:
  contents: read

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      AUTH_SECRET: ci-build-auth-secret-must-be-at-least-32-chars
      NEXTAUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      NEXT_PUBLIC_APP_NAME: Deskteam360
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://ticket.deskteam360.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Package build artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          tar -czf next-build.tar.gz .next public package.json package-lock.json next.config.*

      - name: Upload build artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          retention-days: 1

  deploy:
    name: Deploy production (main)
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-server-main
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: next-build.tar.gz
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # Pull latest code (tanpa build)
            export HUSKY=0
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Install dependencies hanya jika package-lock.json berubah
            export NODE_OPTIONS=--max-old-space-size=1024
            npm ci --no-audit --no-fund --ignore-scripts

            # Extract build hasil dari GitHub Actions (tidak perlu build di server)
            tar -xzf /tmp/next-build.tar.gz -C "${{ secrets.DEPLOY_PATH }}"
            rm -f /tmp/next-build.tar.gz

            # Restart
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart dt-labs || pm2 start npm --name dt-labs -- run start -- -p 3003
            else
              echo "PM2 not found. Start manually: nohup npm run start -- -p 3003 &"
            fi
